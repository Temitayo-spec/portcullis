name: ci
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false # no outside packages, so nothing to cache
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
  expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun run lint
      - run: bunx jest --ci
  podspec:
    # CocoaPods must be able to read the podspec as npm publishes package.json
    # (0.1.0 broke pod install because "repository" became an object).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: pod ipc spec expo/ios/Portcullis.podspec > /dev/null
  image:
    # Publishes ghcr.io/temitayo-spec/portcullis from main, once the tests pass:
    # latest, and the commit's short SHA. amd64 and arm64.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/temitayo-spec/portcullis
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
