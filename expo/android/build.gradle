plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.portcullis'
version = '0.1.0'

android {
  namespace "expo.modules.portcullis"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Play's in-app update screen (startPlayUpdateAsync).
  implementation 'com.google.android.play:app-update:2.1.0'
}
